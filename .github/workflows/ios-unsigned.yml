name: Build unsigned iOS IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ArcadeMacro/**'
      - 'project.yml'
      - '.github/workflows/ios-unsigned.yml'
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build unsigned device app
        run: xcodebuild -project ArcadeMacro.xcodeproj -scheme ArcadeMacro -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' build
      - name: Package unsigned IPA
        run: |
          mkdir -p package/Payload
          ditto build/Build/Products/Release-iphoneos/ArcadeMacro.app package/Payload/ArcadeMacro.app
          cd package
          ditto -c -k --sequesterRsrc --keepParent Payload ../ArcadeMacro-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: ArcadeMacro-unsigned-IPA
          path: ArcadeMacro-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
