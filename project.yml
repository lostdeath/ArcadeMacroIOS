name: ArcadeMacro
options:
  bundleIdPrefix: com.lostdeath420
  deploymentTarget:
    iOS: "15.0"
targets:
  ArcadeMacro:
    type: application
    platform: iOS
    sources:
      - path: ArcadeMacro
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lostdeath420.arcademacro
        PRODUCT_NAME: ArcadeMacro
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: "Scan for and inspect nearby Bluetooth controllers."
        INFOPLIST_KEY_NSBluetoothPeripheralUsageDescription: "Connect to and inspect Bluetooth controller services."
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
